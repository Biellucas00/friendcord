services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-friendcord}
      POSTGRES_USER: ${POSTGRES_USER:-friendcord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-friendcord_dev}
    ports: ["5432:5432"]
    volumes: ["friendcord_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-friendcord} -d ${POSTGRES_DB:-friendcord}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  friendcord_pg:
