name: Apply FriendCord v11
on:
  push:
    branches: [main]
    paths:
      - FriendCord-v11-screen-share.zip
      - .github/workflows/apply-v11.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          unzip -o FriendCord-v11-screen-share.zip
          rm FriendCord-v11-screen-share.zip
          rm .github/workflows/apply-v11.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Aplicar compartilhamento rápido e qualidade'
          git push
