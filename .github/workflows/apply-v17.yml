name: Apply FriendCord v17
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v17.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply package
        run: unzip -o FriendCord-v17-call-layout-deafen.zip -d .
      - name: Clean temporary files
        run: rm FriendCord-v17-call-layout-deafen.zip .github/workflows/apply-v17.yml
      - name: Commit applied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar layout da chamada e silenciamento conjunto"
          git push
