name: Apply FriendCord v16
on:
  push:
    branches: [main]
    paths:
      - FriendCord-v16-compact-call-final.zip
      - .github/workflows/apply-v16.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply package
        run: unzip -o FriendCord-v16-compact-call-final.zip -d .
      - name: Clean temporary files
        run: rm FriendCord-v16-compact-call-final.zip .github/workflows/apply-v16.yml
      - name: Commit applied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar painel compacto e controles da chamada"
          git push
