name: Apply FriendCord v9
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply package
        run: |
          unzip -o FriendCord-v9-mentions.zip
          rm FriendCord-v9-mentions.zip
          rm .github/workflows/apply-v9.yml
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adicionar menções, IAs e ajustes pendentes"
          git push
