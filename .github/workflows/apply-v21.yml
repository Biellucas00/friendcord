name: Apply FriendCord v21
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v21.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o FriendCord-v21-call-icons.zip -d .
      - run: rm FriendCord-v21-call-icons.zip .github/workflows/apply-v21.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar ícones da câmera, supressor e mídia"
          git push
