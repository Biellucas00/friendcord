name: Apply FriendCord v20
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v20.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply package
        run: unzip -o FriendCord-v20-clean-call-settings-categories.zip -d .
      - name: Clean temporary files
        run: rm FriendCord-v20-clean-call-settings-categories.zip .github/workflows/apply-v20.yml
      - name: Commit applied files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar painel clean, configurações e categorias"
          git push
