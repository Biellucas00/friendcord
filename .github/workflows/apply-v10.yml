name: Apply FriendCord v10
on:
  push:
    branches: [main]
    paths:
      - FriendCord-v10-context-audio.zip
      - .github/workflows/apply-v10.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          unzip -o FriendCord-v10-context-audio.zip
          rm FriendCord-v10-context-audio.zip
          rm .github/workflows/apply-v10.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Aplicar controles de áudio e menu contextual'
          git push
