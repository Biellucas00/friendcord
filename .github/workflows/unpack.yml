name: Aplicar FriendCord v3
on:
  push:
    paths:
      - FriendCord-v3-1787250471.zip
      - .github/workflows/unpack.yml
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar projeto
        run: |
          unzip -o FriendCord-v3-1787250471.zip
          rm -f FriendCord-v3-1787250471.zip
          rm -f .github/workflows/unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar perfis, presença e chamadas aprimoradas"
          git push
