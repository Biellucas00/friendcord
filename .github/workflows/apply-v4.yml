name: Apply FriendCord v4
on:
  push:
    paths:
      - FriendCord-v4-source.zip
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source package
        run: |
          rm -rf /tmp/friendcord-v4
          mkdir -p /tmp/friendcord-v4
          unzip -q FriendCord-v4-source.zip -d /tmp/friendcord-v4
          rsync -a --delete --exclude=.git --exclude=.github /tmp/friendcord-v4/ ./
          rm -f FriendCord-v4-source.zip .github/workflows/apply-v4.yml
      - name: Publish source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Aplicar FriendCord v4: chat, DMs, cargos e mídia"
          git push
