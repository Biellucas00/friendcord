name: Apply FriendCord v4 clean
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf /tmp/friendcord-v4
          mkdir -p /tmp/friendcord-v4
          unzip -q FriendCord-v4-source.zip -d /tmp/friendcord-v4
          rsync -a --delete --exclude=.git --exclude=.github /tmp/friendcord-v4/ ./
          rm -f FriendCord-v4-source.zip .github/workflows/apply-v4-clean.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Aplicar pacote limpo FriendCord v4"
          git push
