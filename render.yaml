services:
  - type: web
    name: friendcord-api
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @friendcord/shared build && pnpm --filter @friendcord/server build
    startCommand: pnpm --filter @friendcord/server db:migrate && pnpm --filter @friendcord/server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
  - type: web
    name: friendcord-web
    runtime: static
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @friendcord/shared build && pnpm --filter @friendcord/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_STUN_URL
        value: stun:stun.l.google.com:19302
      - key: VITE_TURN_URL
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false
